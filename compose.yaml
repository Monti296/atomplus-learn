services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atomplus_learn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - atomplus_learn_db:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "3000:3000"

volumes:
  atomplus_learn_db:
